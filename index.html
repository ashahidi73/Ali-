<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Team - فريق التسويق</title>

    <!-- مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- مكتبات React و ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- مكتبة Babel لتحويل كود React داخل المتصفح -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- خط Cairo -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #ffcc4e;
        }

        /* أنميشن مخصص */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation-name: slideUp;
            animation-duration: 0.8s;
            animation-fill-mode: forwards;
        }

        /* حركات التلاشي والدخول الجانبية */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-slide-in-right {
            animation: slideInRight 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-slide-in-left {
            animation: slideInLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const {useState, useEffect} = React;

    // --- تعريف الأيقونات يدوياً (لتعمل بدون استيراد خارجي) ---
    const Icon = ({children, className, size = 24, ...props}) => (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
             strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            {children}
        </svg>
    );

    const Menu = (props) => <Icon {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6"
                                                                                        y2="6"/><line x1="4" x2="20"
                                                                                                      y1="18" y2="18"/></Icon>;
    const X = (props) => <Icon {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
    const Search = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
    const Facebook = (props) => <Icon {...props}><path
        d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></Icon>;
    const Twitter = (props) => <Icon {...props}><path
        d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></Icon>;
    const Linkedin = (props) => <Icon {...props}><path
        d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect
        width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></Icon>;
    const Instagram = (props) => <Icon {...props}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path
        d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5"
                                                                      y2="6.5"/></Icon>;
    const Youtube = (props) => <Icon {...props}><path
        d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path
        d="m10 15 5-3-5-3z"/></Icon>;
    const Phone = (props) => <Icon {...props}><path
        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></Icon>;
    const Layers = (props) => <Icon {...props}><path

    const Star = (props) => <Icon {...props}><polygon

    const ArrowRight = (props) => <Icon {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
    const Clock = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;

    // --- مكونات الصفحة ---

    const MasterBanner = () => {

        ];

        useEffect(() => {
            const timer = setInterval(() => {

            }, 5000);
            return () => clearInterval(timer);
        }, []);

        return (
            <div className="relative w-full h-[600px] overflow-hidden bg-black">

                    <div

                    >

                            style={{backgroundImage: `url(${slide.image})`}}

                            <div className="absolute inset-0 bg-black/50"></div>
                        </div>

                        <div className="absolute inset-0 flex flex-col items-center justify-center space-y-8 z-10">
                            <h2 className="text-4xl md:text-6xl font-bold text-white border-b-4 border-[#ffcc4e] pb-2 drop-shadow-lg text-center px-4">
                                {slide.title}
                            </h2>

                            <a href="#"

                ))}

    };

    const FloatingCards = () => {
        const cards = [
            {
                title: "آخر العروض",
                icon: Gift,
                image: "https://images.unsplash.com/photo-1533750516457-a7f992034fec?auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "آخر الخدمات",
                icon: Layers,
                image: "https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "أخبار التغطية",
                icon: Shield,
                image: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "آخر الفعاليات",
                icon: Star,
                image: "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=600&q=80"
            }
        ];

        return (
            <div className="relative -mt-32 z-20 pb-20 px-4">
                <div className="max-w-7xl mx-auto">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {cards.map((card, index) => (
                            <div
                                key={index}
                                className="group relative h-80 rounded-[20px] overflow-hidden border-2 border-white shadow-2xl bg-gray-900 transform transition-all duration-700 hover:-translate-y-4 opacity-0 animate-slide-up"
                                style={{animationDelay: `${index * 200}ms`}}
                            >
                                <div
                                    className="absolute inset-0 transition-transform duration-700 ease-in-out group-hover:scale-125 bg-cover bg-center"
                                    style={{backgroundImage: `url('${card.image}')`}}
                                >
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

                                            <h3 className="text-xl font-bold text-black">{card.title}</h3>
                                            <span className="text-xs text-gray-500 font-bold">استكشف المزيد</span>
                                        </div>
                                        <div
                                            className="w-10 h-10 bg-[#ffcc4e] rounded-full flex items-center justify-center text-black">
                                            <card.icon size={20}/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );
    };

    const ContentSection = () => {
        const [isVisible, setIsVisible] = useState(false);
        const domRef = React.useRef();

        useEffect(() => {
            const observer = new IntersectionObserver(entries => {
                // تفعيل الحركة عند ظهور 20% من القسم في الشاشة
                if (entries[0].isIntersecting) {
                    setIsVisible(true);
                    observer.disconnect(); // إيقاف المراقبة بعد أول ظهور لتجنب تكرار الحركة
                }
            }, {threshold: 0.2});

            if (domRef.current) observer.observe(domRef.current);

            return () => observer.disconnect();
        }, []);

        return (
            <div ref={domRef}
                 className="bg-white py-24 relative z-10 -mt-10 mb-16 shadow-sm border-t border-b border-gray-100 overflow-hidden">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex flex-col md:flex-row gap-12 md:gap-0">

                        {/* المساحة الأولى: الدور الريادي للتسويق (دخول من اليمين) */}

                            className={`flex-1 md:border-l-4 border-[#ffcc4e] md:pl-16 ${isVisible ? 'animate-slide-in-right' : 'opacity-0'}`}>

                            <p className="text-gray-700 leading-relaxed text-lg text-justify">

                                التنافسي. يكمن الدور الريادي للتسويق في قدرته على قراءة وتحليل اتجاهات السوق، وفهم احتياجات العملاء
                                العميقة، وبناء استراتيجيات مبتكرة تستبق تطلعاتهم. من خلال بناء هوية مؤسسية قوية وتواصل فعال، يساهم
                                التسويق في ترسيخ مكانة العلامة التجارية وخلق ولاء مستدام. إنه الجسر الذي يربط بين الرؤية الاستراتيجية
                                للشركة وتجربة العميل اليومية، مما يضمن تحقيق الأهداف بفعالية وإبداع في عالم رقمي سريع التغير. نحن
                                نؤمن بأن التسويق الناجح هو الذي يروي قصة العلامة التجارية بصدق، ويحول الجمهور المستهدف إلى شركاء
                                حقيقيين في مسيرة النجاح.
                            </p>
                        </div>

                        {/* المساحة الثانية: قوة الجمهور الداخلي (دخول من اليسار) */}
                        <div className={`flex-1 md:pr-16 mt-12 md:mt-0 ${isVisible ? 'animate-slide-in-left' : 'opacity-0'}`}>
                            <h2 className="text-3xl font-black text-black mb-6">قوة الجمهور الداخلي</h2>
                            <p className="text-gray-700 leading-relaxed text-lg text-justify">
                                يعتبر الموظفون هم السفراء الأوائل والأكثر مصداقية لأي علامة تجارية. إن قوة الجمهور الداخلي تتجاوز مجرد
                                أداء المهام الوظيفية؛ فهم يمثلون النبض الحقيقي للشركة وصوتها الموثوق. عندما يؤمن الموظف برسالة
                                المؤسسة وقيمها، يتحول تلقائياً إلى مسوق شغوف يساهم في نشر هذه الرسالة عبر شبكاته الشخصية والمهنية.
                                هذا التبني الداخلي يخلق تأثيراً مضاعفاً، حيث يعزز من ثقة العملاء الخارجيين ويضفي طابعاً إنسانياً
                                وأصيلاً على الهوية المؤسسية. الاستثمار في وعي ومشاركة الموظفين هو استثمار مباشر في توسيع نطاق التأثير
                                التسويقي وتحقيق نجاح مستدام، فالموظف الذي يشعر بالانتماء هو أقوى أداة تسويقية يمكن لأي مؤسسة أن
                                تمتلكها.
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        );
    };

    const NewsSection = () => {
        const news = [
            {
                title: "باقة تلبي احتياجك تماماً",
                subtitle: "باقة 6 جيجا مكس فورجي",
                description: "احصل على:\n• 6 جيجا إنترنت 4G\n• 80 دقيقة ضمن الشبكة\n• 40 دقيقة لكل الشبكات\n• 120 رسالة نصية\n• صلاحية 30 يوماً\n• السعر: 3412 ريالاً (شامل الضريبة)",
                image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "الرمز السحري بين يديك",
                subtitle: "تعرف على أرصدتك وباقات",
                description: "لا تدع الإنترنت ينقطع فجأة! بلمسة واحدة استخدم الرمز #144* لتظل دائماً في الصورة. استعلم مجاناً عن:\n• رصيدك المتبقي (دقائق، رسائل، وإنترنت).\n• تاريخ صلاحية باقاتك المفعلة.",
                image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "حَكّم في تطبيق YOU",
                subtitle: "لأنه عالمك الرقمي",
                description: "تحكم بعالمك الرقمي بسهولة:\n• إدارة وشراء الباقات المفضلة.\n• تسديد الفواتير ومتابعة الأرصدة.\n• الاشتراك وإلغاء الخدمات الإضافية والترفيهية.\n• تحويل الرصيد وإدارة أرقام المجموعة العائلية بكل مرونة.",
                image: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=600&q=80"
            },
            {
                title: "سوا پلس 250",
                subtitle: "لكل الشبكات وبنفس التعرفة",
                description: "باقة التوفير الشاملة لمشتركي صنعاء (1815 ريال شامل الضريبة):\n• 250 دقيقة لكل الشبكات + 250 دقيقة داخل الشبكة.\n• 300 رسالة لجميع الشبكات.\n• صلاحية 30 يوماً.\n• خدمة نغم مجاناً لشهر (للمشتركين الجدد).",
                image: "https://images.unsplash.com/photo-1553877606-3c02d288098a?auto=format&fit=crop&w=600&q=80"
            },
            {
